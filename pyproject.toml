[project]
name = "portia-worker"
version = "0.1.0"
description = "Pinned PyTorch + Transformers (>=5.22, Qwen3.5) stdio worker environment for Portia"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.2.0",
    "llguidance>=1.0.0",
    "numpy>=2.1.0",
    "pillow>=11.0.0",
    "safetensors>=0.5.0",
    "tokenizers>=0.21.0",
    "torch>=2.6.0",
    "transformers>=5.22.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
